[project]
name = "gdmirror"
version = "0.1.0"
description = "Interactive terminal app to mirror a Google Drive folder to disk or stream it to Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "abderrahmane" }]
keywords = ["google-drive", "telegram", "tui", "downloader", "backup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "textual>=1.0",
    "rich>=13.7",
    "telethon>=1.44.0",
]

[project.scripts]
gdmirror = "gdmirror.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdmirror"]
